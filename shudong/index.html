<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohub 匿名树洞 - ArousX_CORE // Magic UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../magicui.css">
    <style>
        .input-magic {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: #fff;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .input-magic:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .msg-card {
            background: #09090b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            box-shadow: 0 -20px 80px -20px rgba(255, 255, 255, 0.08) inset;
            padding: 1.25rem 1.5rem;
            transition: all 0.2s ease-out;
        }
        .msg-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Magic UI: Dot Pattern Background -->
    <div class="dot-pattern-bg"></div>

    <div class="container" style="max-width: 860px;">
        <!-- Magic UI: Navbar -->
        <header class="navbar">
            <a href="../" class="brand">
                <div class="brand-icon">M</div>
                <span style="font-weight: 700; font-size: 0.95rem;">ArousX_CORE</span>
                <span style="font-family: 'JetBrains Mono'; font-size: 0.75rem; color: #71717a;">/ shudong</span>
            </a>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <a href="../catalog/" style="display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem; border-radius: 9999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #a1a1aa; text-decoration: none; font-size: 0.8rem; font-weight: 600; transition: all 0.2s;">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span>返回档案</span>
                </a>
            </div>
        </header>

        <!-- Header -->
        <section style="text-align: center; margin-bottom: 2.5rem;">
            <div class="shiny-badge-wrapper">
                <div class="shiny-badge">
                    <span class="shiny-text">🔒 端到端匿名倾诉交互终端</span>
                </div>
            </div>
            <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; margin-bottom: 0.5rem;">Mohub 匿名树洞</h1>
            <p style="color: var(--muted-foreground); font-size: 0.95rem;">把想说的话留在树洞里，总有人会默默听见。无痕、保密、安全。</p>
        </section>

        <!-- 发布卡片 -->
        <div class="bento-card" style="margin-bottom: 2.5rem; padding: 1.75rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; font-size: 0.75rem; font-weight: 700; font-family: 'JetBrains Mono'; color: #34d399;">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981;"></span>
                <span>NEW TRANSMISSION // 新建倾诉</span>
            </div>

            <input id="authorInput" class="input-magic" style="margin-bottom: 0.75rem;" placeholder="昵称 / USER_ALIAS (留空则默认为匿名)">
            <textarea id="contentInput" class="input-magic" style="height: 7rem; resize: none; margin-bottom: 1.25rem;" placeholder="写下你的心事与动态..."></textarea>

            <button id="submitBtn" class="magic-btn" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.85rem; cursor: pointer;">
                <span>发射心声至树洞 [ EXECUTE ]</span>
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>

        <!-- 留言板区 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <div style="font-size: 0.8rem; font-weight: 700; color: #a1a1aa; font-family: 'JetBrains Mono';">
                MESSAGE RECORDS // 树洞留言记录
            </div>
            <div style="font-size: 0.72rem; color: #71717a; font-family: 'JetBrains Mono';">
                SUPABASE CLOUD SYNC
            </div>
        </div>

        <div id="messageBoard" style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="text-align: center; color: #60a5fa; font-family: 'JetBrains Mono'; font-size: 0.85rem; padding: 3rem 0;" class="shiny-text">
                > CONNECTING DATABASE...
            </div>
        </div>

        <footer style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.08); font-family: 'JetBrains Mono'; font-size: 0.75rem; color: #71717a; display: flex; justify-content: space-between; align-items: center;">
            <div>ArousX_CORE © 2026 · Magic UI Architecture</div>
            <div style="display: flex; gap: 1.5rem;">
                <a href="../" style="color: #a1a1aa; text-decoration: none;">Home</a>
                <a href="../catalog/" style="color: #a1a1aa; text-decoration: none;">Catalog</a>
                <a href="../game/" style="color: #a1a1aa; text-decoration: none;">Game</a>
                <a href="https://mohub.online" style="color: #a1a1aa; text-decoration: none;">mohub.online</a>
            </div>
        </footer>
    </div>

    <!-- WebGL 水墨流体背景引擎 -->
    <script src="../webgl_ink.js"></script>

    <!-- 逻辑层：Supabase 数据连接与操作 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const client = window.supabase.createClient(
        'https://ovfwarzvmdynmysdagmy.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Zndhcnp2bWR5bm15c2RhZ215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNTQ5NzQsImV4cCI6MjA5MTczMDk3NH0.ZzAec-6TcRIOxfviuWSx8rdwR8S_8YeoeD_L7IWt0Gs'
    );

    const TABLE = 'hold';

    const board = document.getElementById('messageBoard');
    const btn = document.getElementById('submitBtn');
    const authorInput = document.getElementById('authorInput');
    const contentInput = document.getElementById('contentInput');

    async function load() {
        const { data, error } = await client
            .from(TABLE)
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            board.innerHTML = `<div style="color: #ef4444; font-family: 'JetBrains Mono'; text-align: center; padding: 2rem 0;">> ERROR: ${error.message}</div>`;
            return;
        }

        board.innerHTML = '';

        if (!data.length) {
            board.innerHTML = '<div style="color: #71717a; font-family: 'JetBrains Mono'; text-align: center; padding: 2rem 0;">> 树洞目前为空，快来留下第一条心声吧...</div>';
            return;
        }

        data.forEach(i => board.appendChild(card(i)));
    }

    async function send() {
        const author = authorInput.value.trim() || '匿名';
        const content = contentInput.value.trim();

        if (!content) return alert('内容不能为空');

        btn.disabled = true;
        btn.innerHTML = '<span>> 发送中...</span>';

        const { data, error } = await client
            .from(TABLE)
            .insert([{ author, content }])
            .select();

        btn.disabled = false;
        btn.innerHTML = '<span>发射心声至树洞 [ EXECUTE ]</span><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';

        if (error) return alert(error.message);

        contentInput.value = '';
        board.prepend(card(data[0]));
    }

    function card(i) {
        const div = document.createElement('div');
        div.className = 'msg-card';

        div.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                <div style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.55rem; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 0.4rem; font-size: 0.72rem; font-family: 'JetBrains Mono'; color: #60a5fa; font-weight: 700;">
                    ${escapeHtml(i.author)}
                </div>
                <span style="color: #71717a; font-size: 0.7rem; font-family: 'JetBrains Mono';">${new Date(i.created_at).toLocaleString()}</span>
            </div>
            <div style="font-size: 0.88rem; color: #e4e4e7; line-height: 1.6; white-space: pre-wrap; word-break: break-word;">
                ${escapeHtml(i.content)}
            </div>
        `;
        return div;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    btn.onclick = send;
    load();
    </script>
</body>
</html>
